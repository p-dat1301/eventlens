name: eventlens

services:
  crud-api:
    build:
      context: .
      dockerfile: docker/crud-api.Dockerfile
    environment:
      # Internal catalog of rag-api (never through the public proxy).
      EVENTLENS_CRUD_RAG_CATALOG_URL: http://rag-api:8001
      EVENTLENS_CRUD_RAG_SERVICE_TOKEN: ${EVENTLENS_INTERNAL_SERVICE_TOKEN:-}
    ports:
      - "8000:8000"

  rag-api:
    build:
      context: .
      dockerfile: docker/rag-api.Dockerfile
    environment:
      # Empty = fixture-only runtime (catalog/chat answer 503, legacy /briefing works).
      EVENTLENS_API_RAG_DATABASE_URL: ${EVENTLENS_API_RAG_DATABASE_URL:-}
      EVENTLENS_RAG_INTERNAL_SERVICE_TOKEN: ${EVENTLENS_INTERNAL_SERVICE_TOKEN:-}
      EVENTLENS_RAG_ANSWER_PROVIDER: ${EVENTLENS_RAG_ANSWER_PROVIDER:-none}
    ports:
      - "8001:8001"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - crud-api
      - rag-api

  rag-worker:
    build:
      context: .
      dockerfile: docker/rag-worker.Dockerfile
    environment:
      EVENTLENS_RAG_DATABASE_URL: postgresql://eventlens:eventlens-local@postgres:5432/eventlens_rag
    command: ["enrich", "--max-jobs", "5"]
    profiles: ["tools"]

  event-pipeline:
    build:
      context: .
      dockerfile: docker/event-pipeline.Dockerfile
    command: ["validate", "/fixtures/article_bundle.v1.json"]
    profiles: ["tools"]
    volumes:
      - ./fixtures:/fixtures:ro

  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: eventlens
      POSTGRES_USER: eventlens
      POSTGRES_PASSWORD: eventlens-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventlens -d eventlens"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    profiles: ["infra"]
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: eventlens
      MINIO_ROOT_PASSWORD: eventlens-local-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    profiles: ["infra"]
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
