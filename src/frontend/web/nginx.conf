# Same-origin gateway for the web app. Route table (docs: src/frontend/web/README.md):
#   crud-api:8000  /api/v1/articles[/...], /api/v1/article-facets, /api/v1/topics,
#                  /api/v1/locations, /api/v1/sources
#   rag-api:8001   /api/v1/sessions[/...], /api/v1/conversations[/...],
#                  /api/v1/runs[/...], /briefing[/...]
#   blocked        /internal[/...] and every other /api/ path (JSON 404, never index.html)
# proxy_pass has no URI part, so path and query string are forwarded unchanged; the
# Cookie and X-Request-ID request headers pass through by default.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Resolve the API hosts per request through Docker's DNS, so a recreated
  # container (new IP) is reached without restarting this gateway.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $crud_api http://crud-api:8000;
  set $rag_api http://rag-api:8001;

  # Nginx-generated upstream failures (service down) answer the API error
  # envelope instead of an HTML page. Upstream JSON errors pass through as-is.
  location @api_unavailable {
    default_type application/json;
    return 503 '{"schema_version":"api_error.v1","error":{"code":"upstream_unavailable","reason":null,"request_id":null}}';
  }

  location ~ ^/internal(/|$) {
    default_type application/json;
    return 404 '{"schema_version":"api_error.v1","error":{"code":"not_found","reason":null,"request_id":null}}';
  }

  location ~ ^/api/v1/(articles|article-facets|topics|locations|sources)(/|$) {
    proxy_pass $crud_api;
    include /etc/nginx/conf.d/proxy-common.inc;
    error_page 502 504 = @api_unavailable;
  }

  location ~ ^/api/v1/(sessions|conversations|runs)(/|$) {
    proxy_pass $rag_api;
    include /etc/nginx/conf.d/proxy-common.inc;
    error_page 502 504 = @api_unavailable;
  }

  location = /briefing {
    proxy_pass $rag_api;
    include /etc/nginx/conf.d/proxy-common.inc;
  }

  location ^~ /briefing/ {
    proxy_pass $rag_api;
    include /etc/nginx/conf.d/proxy-common.inc;
  }

  # Plain prefix (not ^~): the API regex locations above are matched first;
  # only unrouted /api/ paths fall through to this JSON 404.
  location /api/ {
    default_type application/json;
    return 404 '{"schema_version":"api_error.v1","error":{"code":"not_found","reason":null,"request_id":null}}';
  }

  # Fingerprinted build assets are immutable; index.html is always revalidated.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback: deep links such as /news, /articles/<id> and /chat/<id> load the app.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
