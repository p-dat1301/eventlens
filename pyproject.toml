[project]
name = "eventlens"
version = "0.1.0"
description = "EventLens modular monolith: CRUD, RAG and event pipeline contexts"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "langgraph>=1.0,<2",
    "polars>=1.30,<2",
    "psycopg[binary]>=3.2,<4",
    "pyarrow>=20,<21",
    "pydantic>=2.11,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "typer>=0.16,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
eventlens-crud-api = "backend.crud.main:run"
eventlens-rag-api = "backend.rag.api_main:run"
eventlens-rag = "backend.rag.cli_main:app"
eventlens-rag-worker = "backend.rag.worker_main:app"
eventlens-events = "backend.event_pipeline.presentation.cli:app"
# Deprecated alias; remove in the PR after this refactor.
eventlens-worker = "backend.compat.worker_alias:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "backend"

[dependency-groups]
dev = [
    "basedpyright>=1.31,<2",
    "httpx2>=2.12.0",
    "jsonschema>=4.25,<5",
    "pyarrow-stubs>=19",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.basedpyright]
typeCheckingMode = "all"
stubPath = "typings"
pythonVersion = "3.12"
pythonPlatform = "All"
include = ["src/backend", "tests"]
extraPaths = ["tests/support"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests/support"]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ISC001", "D203", "D213", "CPY001"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101", "PLR2004", "D", "INP001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tests/support"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
