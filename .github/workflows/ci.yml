name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --frozen --group dev

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"

      - name: Cache Bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('src/frontend/web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install web dependencies
        working-directory: src/frontend/web
        run: bun install --frozen-lockfile

      - name: Assert no provider credentials in the environment
        run: |
          if env | grep -E -i '^(OPENAI|ANTHROPIC|AZURE_OPENAI)[A-Z_]*=|API_KEY=' >/dev/null; then
            echo "provider credential variable present; CI must run fake-only" >&2
            exit 1
          fi

      # make check includes DB-dependent tests that SKIP without a database;
      # those skips are not database evidence (see the database job).
      - name: Run checks
        run: make check

  database:
    name: Database suite (PostgreSQL/pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_DB: rag_test
          POSTGRES_USER: rag_test
          POSTGRES_PASSWORD: rag-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag_test -d rag_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      EVENTLENS_RAG_DATABASE_URL: postgresql://rag_test:rag-test-only@127.0.0.1:5432/rag_test
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --frozen --group dev

      - name: Assert no provider credentials in the environment
        run: |
          if env | grep -E -i '^(OPENAI|ANTHROPIC|AZURE_OPENAI)[A-Z_]*=|API_KEY=' >/dev/null; then
            echo "provider credential variable present; CI must run fake-only" >&2
            exit 1
          fi

      # migrate -> load fixtures -> rebuild -> loopback rag-api smoke (health,
      # cited briefing, citation inspection) -> full DB suite; any skip fails.
      - name: Run database gate steps
        run: |
          export G3_EVIDENCE_DIR="$RUNNER_TEMP/g3-db"
          mkdir -p "$G3_EVIDENCE_DIR"
          sh scripts/rag/gate-g3-db.sh

      - name: Show exit codes
        if: always()
        run: cat "$RUNNER_TEMP/g3-db/exit-codes.tsv" || true

      # Separate database: historical runner -> refused -> preflight -> adopt ->
      # migrate -> rebuild -> worker -> rag-api citation smoke.
      - name: Create adoption database
        run: |
          PGPASSWORD=rag-test-only psql -h 127.0.0.1 -U rag_test -d rag_test \
            -v ON_ERROR_STOP=1 -c 'CREATE DATABASE rag_adopt'

      - name: Legacy adoption smoke
        env:
          EVENTLENS_RAG_DATABASE_URL: postgresql://rag_test:rag-test-only@127.0.0.1:5432/rag_adopt
        run: |
          export ADOPT_EVIDENCE_DIR="$RUNNER_TEMP/adopt"
          mkdir -p "$ADOPT_EVIDENCE_DIR"
          sh scripts/rag/adopt-smoke.sh

      # Full pytest logs, JUnit XML and step logs, kept even when a step fails.
      - name: Upload database evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: database-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/g3-db
            ${{ runner.temp }}/adopt
          if-no-files-found: warn
          retention-days: 30

  eval:
    name: Enrichment and RAG evals
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --frozen --group dev

      - name: Assert no provider credentials in the environment
        run: |
          if env | grep -E -i '^(OPENAI|ANTHROPIC|AZURE_OPENAI)[A-Z_]*=|API_KEY=' >/dev/null; then
            echo "provider credential variable present; CI must run fake-only" >&2
            exit 1
          fi

      - name: Enrichment eval
        run: make enrichment-eval EVAL_OUT="$RUNNER_TEMP/eval"

      - name: RAG eval
        run: make rag-eval EVAL_OUT="$RUNNER_TEMP/eval"

      - name: Reports are reproducible
        run: |
          make enrichment-eval rag-eval EVAL_OUT="$RUNNER_TEMP/eval-rerun"
          cmp "$RUNNER_TEMP/eval/enrichment-eval.json" "$RUNNER_TEMP/eval-rerun/enrichment-eval.json"
          cmp "$RUNNER_TEMP/eval/rag-eval.json" "$RUNNER_TEMP/eval-rerun/rag-eval.json"

  browser:
    name: Browser gate
    runs-on: ubuntu-latest
    env:
      EVENTLENS_BROWSER: chromium
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"

      - name: Cache Bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('src/frontend/web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install web dependencies
        working-directory: src/frontend/web
        run: bun install --frozen-lockfile

      - name: Assert no provider credentials in the environment
        run: |
          if env | grep -E -i '^(OPENAI|ANTHROPIC|AZURE_OPENAI)[A-Z_]*=|API_KEY=' >/dev/null; then
            echo "provider credential variable present; CI must run fake-only" >&2
            exit 1
          fi

      # Chromium revision is pinned by the locked playwright-core version.
      - name: Install pinned Chromium
        working-directory: src/frontend/web
        run: bunx playwright-core install --with-deps chromium

      - name: Run browser gate
        working-directory: src/frontend/web
        run: bun run test:e2e
